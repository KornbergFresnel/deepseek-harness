# 把 SenseCore SSP 训练任务工具、“集群任务”和“集群配置”页面，以及新会话页面的 Git 分支切换加进 dsh。
# 填好下面的 sco 路径后使用。
# 用法：在 deepseek-harness 仓库根目录执行
#   pnpm dsh web --patch packages/experimental/cluster-monitor/sco.patch.yml
- insert:
    - id: sco
      name: '@deepseek-ai/dsh-experimental-sco'
      config:
        # sco 的绝对路径；sco 已在 PATH 里可以删掉这一行
        command: /home/<你的用户名>/.sco/bin/sco
        # 默认 SSP 工作空间和队列（可选）。也可以在“集群配置”页面的基本设置里填写，
        # 页面保存的值优先于这里，并按 sco profile 分开保存
        # workspace: <你的工作空间>
        # queueId: /subscriptions/.../clusters/<集群>/queues/<队列>
    # 按名字登记数据、代码和输出位置，按模板提交任务；需要基础 bundle 里的存储服务
    - id: sco-submit
      name: '@deepseek-ai/dsh-experimental-sco-submit'
      config:
        # 每个任务在容器内挂载输出目录的路径，AFS 上对应 /<输出根目录>/<任务名>
        outputMountPath: /outputs
        # 任务模板（可选）。code、data、output 写数据源名字，数据源在“集群配置”页面或对话里登记
        # templates:
        #   wbt-train:
        #     image: <CCR 镜像>
        #     code: rlightning-humanoid
        #     data: [motion-lafan]
        #     output: wbt-outputs
        #     command: python scripts/rsl_rl/train.py --task Tracking-Flat-G1 --headless
    - id: tool-sco
      name: '@deepseek-ai/dsh-experimental-tool-sco'
    # 定时用 sco 轮询关注的任务，解析训练曲线和日志；agent 提交的任务会自动关注
    - id: cluster-monitor
      name: '@deepseek-ai/dsh-experimental-cluster-monitor'
      config:
        # 任务运行中的轮询间隔（毫秒，最小 5000）
        runningPollMs: 30000
        # 排队或状态未知时的轮询间隔（毫秒，最小 5000）
        pendingPollMs: 60000
        # 训练曲线默认从日志解析（experiment-logger 表格、JSON 行、key=value 行）；
        # 其他格式可在任务详情里改指标来源，或在这里改默认解析器
        # logParsers:
        #   - kind: regex
        #     pattern: 'iter (?<step>\d+) .*loss=(?<loss>[\d.]+)'
    # 从 Weights & Biases 读取训练曲线（可选）：需要环境变量或凭据 WANDB_API_KEY，
    # 然后在任务详情把指标来源改成 Weights & Biases，或设 cluster-monitor 的 defaultMetricSource: wandb
    # - id: cluster-metrics-wandb
    #   name: '@deepseek-ai/dsh-experimental-cluster-metrics-wandb'
    # Web 侧边栏里的“集群任务”和“集群配置”页面
    - id: client-ui-cluster-monitor
      name: '@deepseek-ai/dsh-experimental-client-ui-cluster-monitor'
    # 新会话页面在“PTC 模式”后显示当前 Git 分支，点击切换
    - id: git-branch
      name: '@deepseek-ai/dsh-experimental-git-branch'
    - id: client-ui-git-branch
      name: '@deepseek-ai/dsh-experimental-client-ui-git-branch'
